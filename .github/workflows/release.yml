name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install '.[test]'
      - name: Verify release source
        run: python -m pytest -q
      - name: Build release package
        run: python tools/build_release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_NAME="market-data-api-${RELEASE_VERSION}"
          gh release create "${GITHUB_REF_NAME}" \
            --target "${GITHUB_SHA}" \
            "dist/${RELEASE_NAME}-easy-install.tar.gz" \
            "dist/${RELEASE_NAME}-easy-install.tar.gz.sha256" \
            "dist/${RELEASE_NAME}/SHA256SUMS" \
            "dist/${RELEASE_NAME}/bin/mdapi-gateway.pyz" \
            "dist/${RELEASE_NAME}/wheels/market_data_api-${RELEASE_VERSION}-py3-none-any.whl" \
            --title "Market Data API ${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md
